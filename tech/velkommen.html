<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velkommen</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      padding: 40px;
      text-align: center;
      line-height: 1.7;
    }

    .main {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .sub {
      font-size: 18px;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .note {
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="main">Velkommen til din computer.</p>

    <p class="sub">
      Den er blevet genanvendt med en let version af Linux.
    </p>

    <p class="note">
      Pas godt på den. Systemet kan ændres frit, så vær forsigtig med hvad der installeres og slettes.
    </p>
  </div>
</body>
</html>
